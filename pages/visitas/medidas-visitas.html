<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medidas e Visitas — ArteSynal</title>
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .visitas-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 24px 8px;
      flex-wrap: wrap;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
    }

    .board-area {
      flex: 1;
      min-height: 0;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      padding: 10px 24px 22px;
      display: grid;
      grid-template-columns: repeat(3, minmax(310px, 1fr));
      gap: 18px;
      overflow-x: auto;
    }

    .kanban-col {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      box-shadow: var(--shadow-sm);
      transition: border-color var(--transition), background var(--transition);
    }

    .kanban-col.drag-over {
      border-color: var(--brand);
      background: var(--bg-elevated);
    }

    .kanban-col-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .col-title-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 13.5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .col-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .col-dot.red { background: var(--red); box-shadow: 0 0 8px var(--red); }
    .col-dot.blue { background: var(--blue); box-shadow: 0 0 8px var(--blue); }
    .col-dot.green { background: var(--green); box-shadow: 0 0 8px var(--green); }

    .cards-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .visit-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-left: 4px solid var(--blue);
      border-radius: var(--radius-md);
      padding: 15px;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .visit-card.st-solicitacoes { border-left-color: var(--red); }
    .visit-card.st-andamento { border-left-color: var(--blue); }
    .visit-card.st-concluido { border-left-color: var(--green); }

    .visit-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-strong);
    }

    .visit-card.dragging {
      opacity: 0.45;
      transform: scale(0.98);
    }

    .visit-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .visit-empresa {
      font-family: var(--font-display);
      font-size: 16.5px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .visit-servico {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--brand);
      letter-spacing: 0.3px;
    }

    .visit-meta {
      font-size: 12.5px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .empty-col {
      padding: 32px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      border: 1.5px dashed var(--border-subtle);
      border-radius: var(--radius-md);
    }

    .archive-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .archive-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    @media (max-width: 820px) {
      body { height: auto; min-height: 100dvh; overflow-y: auto; }
      .visitas-toolbar { padding: 12px; }
      .visitas-toolbar .ui-input { max-width: none !important; width: 100%; }
      .board-area {
        padding: 6px 12px 24px;
        display: flex;
        scroll-snap-type: x mandatory;
        overflow-x: auto;
      }
      .kanban-col {
        min-width: 86vw;
        max-height: 70dvh;
        scroll-snap-align: center;
      }
      .hide-sm { display: none; }
    }
  </style>
</head>
<body>
  <header class="app-topbar">
    <a href="../../index.html" class="app-brand">
      <img src="../../assets/img/logo-artesynal.png" alt="ArteSynal" class="app-brand-logo" />
      <span class="app-brand-divider"></span>
      <div class="app-brand-text">
        <span class="app-brand-title">MEDIDAS E VISITAS</span>
        <span class="app-brand-sub">Agenda Técnica, Mídias e Cotas</span>
      </div>
    </a>

    <div class="app-topbar-actions">
      <button type="button" class="ui-btn ui-btn-primary" onclick="window.abrirModalNovo()">
        ➕ Nova Visita
      </button>
      <button type="button" class="ui-btn ui-btn-sm" onclick="window.toggleDrawerArquivados()">
        📁 Arquivados <span id="badge-arq" class="ui-badge" style="padding:1px 6px;">0</span>
      </button>
      <button type="button" class="ui-btn ui-btn-sm" data-theme-toggle>☀️ Claro</button>
      <a href="../../index.html" class="ui-btn ui-btn-sm">⬅ Painel</a>
    </div>
  </header>

  <div class="visitas-toolbar">
    <input id="busca-visitas" type="search" class="ui-input" style="max-width: 440px;" placeholder="Filtrar por empresa, cliente, tipo de serviço ou endereço..." />
    <span style="font-size:12px; color:var(--text-muted);">Arraste os cards entre colunas ou clique para abrir fotos, vídeos e medidas.</span>
  </div>

  <main class="board-area">
    <section class="kanban-col" data-col-status="solicitacoes">
      <div class="kanban-col-head">
        <div class="col-title-wrap"><span class="col-dot red"></span> Solicitações</div>
        <span class="ui-badge ui-badge-red" id="count-solicitacoes">0</span>
      </div>
      <div id="col-solicitacoes" class="cards-scroll"></div>
    </section>

    <section class="kanban-col" data-col-status="andamento">
      <div class="kanban-col-head">
        <div class="col-title-wrap"><span class="col-dot blue"></span> Em Andamento</div>
        <span class="ui-badge ui-badge-blue" id="count-andamento">0</span>
      </div>
      <div id="col-andamento" class="cards-scroll"></div>
    </section>

    <section class="kanban-col" data-col-status="concluido">
      <div class="kanban-col-head">
        <div class="col-title-wrap"><span class="col-dot green"></span> Concluído</div>
        <span class="ui-badge ui-badge-green" id="count-concluido">0</span>
      </div>
      <div id="col-concluido" class="cards-scroll"></div>
    </section>
  </main>

  <!-- DRAWER DE ARQUIVADOS -->
  <aside id="drawer-arquivados" class="ui-drawer">
    <div style="display:flex; justify-content:space-between; align-items:center; padding-bottom:12px; border-bottom:1px solid var(--border-subtle);">
      <h3 style="margin:0; font-family:var(--font-display); font-size:16px;">📁 Visitas Arquivadas</h3>
      <button type="button" class="ui-btn ui-btn-sm" onclick="window.toggleDrawerArquivados()">✖</button>
    </div>
    <div style="margin-top:12px;">
      <input id="busca-arquivadas" type="search" class="ui-input" placeholder="🔍 Buscar arquivadas por empresa, cliente, serviço ou endereço..." />
      <div id="lbl-arquivadas-count" style="font-size:11.5px; color:var(--text-muted); margin-top:6px; font-weight:600;"></div>
    </div>
    <div id="archive-list" class="archive-list"></div>
  </aside>

  <!-- MODAL NOVA VISITA -->
  <div id="modal-novo" class="ui-modal-backdrop">
    <form id="form-novo" class="ui-modal" style="max-width: 480px;">
      <div class="ui-modal-header">
        <h3 class="ui-modal-title">Agendar / Criar Medida ou Visita</h3>
        <button type="button" class="ui-btn ui-btn-sm" onclick="window.fecharModalNovo()">✖</button>
      </div>

      <div style="display:flex; flex-direction:column; gap:14px;">
        <div class="ui-field">
          <label class="ui-label" for="novo-empresa">Nome da Empresa</label>
          <input id="novo-empresa" class="ui-input" required placeholder="Empresa contratante" />
        </div>

        <div class="ui-field">
          <label class="ui-label" for="novo-cliente">Contato / Cliente</label>
          <input id="novo-cliente" class="ui-input" required placeholder="Responsável no local" />
        </div>

        <div class="ui-field">
          <label class="ui-label" for="novo-servico">Tipo / Nome do Serviço</label>
          <input id="novo-servico" class="ui-input" required placeholder="Ex: Fachada ACM, Letra Caixa, Adesivação" />
        </div>

        <div class="ui-field">
          <label class="ui-label" for="novo-endereco">Endereço da Visita (Opcional)</label>
          <input id="novo-endereco" class="ui-input" placeholder="Rua, número, bairro, cidade" />
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:22px;">
        <button type="button" class="ui-btn" onclick="window.fecharModalNovo()">Cancelar</button>
        <button type="submit" class="ui-btn ui-btn-primary" id="btn-submit-novo">Criar e Abrir Ficha</button>
      </div>
    </form>
  </div>

  <script type="module">
    import '../../js/core/theme.js';
    import { showToast } from '../../js/core/theme.js';
    import { db, ROTAS } from '../../js/core/config.js';
    import { protegerPagina } from '../../js/core/auth.js';
    import {
      collection,
      getDocs,
      addDoc,
      doc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    await protegerPagina({ paginaAtual: 'medidas-visitas.html' });

    const STATUS = ['solicitacoes', 'andamento', 'concluido'];
    let visitas = [];
    let draggedVisitId = null;

    const safe = (v) => String(v ?? '').replace(/[&<>'"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));

    const normalizeStatus = (s) => {
      const v = String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '_');
      if (['andamento', 'em_andamento', 'enviado'].includes(v)) return 'andamento';
      if (['concluido', 'concluida', 'finalizado', 'finalizada'].includes(v)) return 'concluido';
      return 'solicitacoes';
    };

    function cardHtml(v) {
      const st = normalizeStatus(v.status);
      const idx = STATUS.indexOf(st);
      const totalMidias = Number(v.totalImagens || (Array.isArray(v.imagens) ? v.imagens.length : 0));
      const midiasBadge = totalMidias > 0 ? `<span class="ui-badge ui-badge-brand">📷 ${totalMidias}</span>` : '';
      const mapsBtn = v.endereco
        ? `<button type="button" class="ui-btn ui-btn-sm" style="padding:4px 7px;" onclick="window.abrirMapsCard(event, '${safe(v.endereco)}')" title="Abrir endereço no Maps">🗺️</button>`
        : '';

      return `
        <article id="card-${v.id}" class="visit-card st-${st}" draggable="true" data-visit-id="${v.id}" onclick="window.abrirCard('${v.id}', event)">
          <div class="visit-card-top" onclick="event.stopPropagation()">
            <div style="display:flex; gap:4px;">
              <button type="button" class="ui-btn ui-btn-sm" style="padding:3px 8px;" ${idx === 0 ? 'disabled' : ''} onclick="window.moverCard(event, '${v.id}', -1)" title="Voltar etapa">❮</button>
              <button type="button" class="ui-btn ui-btn-sm" style="padding:3px 8px;" ${idx === STATUS.length - 1 ? 'disabled' : ''} onclick="window.moverCard(event, '${v.id}', 1)" title="Avançar etapa">❯</button>
            </div>
            <div style="display:flex; gap:5px; align-items:center;">
              ${midiasBadge}
              ${mapsBtn}
              <button type="button" class="ui-btn ui-btn-sm" style="padding:4px 7px;" onclick="window.arquivarCard(event, '${v.id}', true)" title="Arquivar visita">📁</button>
              <button type="button" class="ui-btn ui-btn-sm ui-btn-danger" style="padding:4px 7px;" onclick="window.deletarCard(event, '${v.id}')" title="Excluir visita">🗑️</button>
            </div>
          </div>
          <div class="visit-empresa">${safe(v.empresa || 'Empresa não informada')}</div>
          <div class="visit-servico">${safe(v.servico || v.tipo_servico || 'Serviço técnico')}</div>
          <div class="visit-meta">
            <span>👤 ${safe(v.cliente || 'Sem contato')}</span>
            ${v.endereco ? `<span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">📍 ${safe(v.endereco)}</span>` : ''}
          </div>
        </article>
      `;
    }

    function archiveHtml(v) {
      return `
        <div class="archive-card">
          <div style="min-width:0; flex:1;">
            <div style="font-weight:800; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${safe(v.empresa || 'Sem empresa')}</div>
            <div style="font-size:11.5px; color:var(--text-muted);">${safe(v.servico || v.tipo_servico || 'Serviço')} • ${safe(v.cliente || '')}</div>
          </div>
          <div style="display:flex; gap:5px;">
            <button type="button" class="ui-btn ui-btn-sm" style="padding:4px 7px;" onclick="window.arquivarCard(event, '${v.id}', false)" title="Restaurar ao quadro">↩️</button>
            <button type="button" class="ui-btn ui-btn-sm" style="padding:4px 7px;" onclick="window.abrirCard('${v.id}', event, true)" title="Visualizar">👁️</button>
            <button type="button" class="ui-btn ui-btn-sm ui-btn-danger" style="padding:4px 7px;" onclick="window.deletarCard(event, '${v.id}')" title="Excluir">🗑️</button>
          </div>
        </div>
      `;
    }

    function render() {
      const termo = document.getElementById('busca-visitas').value.trim().toLowerCase();
      const groups = { solicitacoes: [], andamento: [], concluido: [], arquivados: [] };

      visitas.forEach((v) => {
        if (v.arquivado) {
          groups.arquivados.push(v);
          return;
        }
        if (termo) {
          const match = [v.empresa, v.cliente, v.servico, v.tipo_servico, v.endereco, v.observacoes].some((x) =>
            String(x || '').toLowerCase().includes(termo)
          );
          if (!match) return;
        }
        groups[normalizeStatus(v.status)].push(v);
      });

      STATUS.forEach((st) => {
        document.getElementById(`count-${st}`).textContent = String(groups[st].length);
        const col = document.getElementById(`col-${st}`);
        col.innerHTML = groups[st].length
          ? groups[st].map(cardHtml).join('')
          : '<div class="empty-col">Nenhuma visita nesta etapa</div>';
      });

      document.getElementById('badge-arq').textContent = String(groups.arquivados.length);
      const termoArq = (document.getElementById('busca-arquivadas')?.value || '').trim().toLowerCase();
      const arquivadosFiltrados = termoArq
        ? groups.arquivados.filter((v) =>
            [v.empresa, v.cliente, v.servico, v.tipo_servico, v.endereco, v.observacoes].some((x) =>
              String(x || '').toLowerCase().includes(termoArq)
            )
          )
        : groups.arquivados;

      document.getElementById('lbl-arquivadas-count').textContent = termoArq
        ? `Exibindo ${arquivadosFiltrados.length} de ${groups.arquivados.length} arquivada(s)`
        : `${groups.arquivados.length} visita(s) arquivada(s)`;

      document.getElementById('archive-list').innerHTML = arquivadosFiltrados.length
        ? arquivadosFiltrados.map(archiveHtml).join('')
        : `<div class="empty-col">${termoArq ? 'Nenhuma arquivada corresponde à busca' : 'Nenhum card arquivado'}</div>`;

      document.querySelectorAll('.visit-card[data-visit-id]').forEach((card) => {
        card.addEventListener('dragstart', (ev) => {
          draggedVisitId = card.dataset.visitId;
          card.classList.add('dragging');
          if (ev.dataTransfer) ev.dataTransfer.setData('text/plain', draggedVisitId);
        });
        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          draggedVisitId = null;
          document.querySelectorAll('.kanban-col').forEach((c) => c.classList.remove('drag-over'));
        });
      });
    }

    document.querySelectorAll('.kanban-col[data-col-status]').forEach((col) => {
      col.addEventListener('dragover', (ev) => {
        if (!draggedVisitId) return;
        ev.preventDefault();
        col.classList.add('drag-over');
      });
      col.addEventListener('dragleave', (ev) => {
        if (!col.contains(ev.relatedTarget)) col.classList.remove('drag-over');
      });
      col.addEventListener('drop', async (ev) => {
        ev.preventDefault();
        col.classList.remove('drag-over');
        const id = ev.dataTransfer?.getData('text/plain') || draggedVisitId;
        const novoStatus = col.dataset.colStatus;
        if (!id || !novoStatus) return;
        const item = visitas.find((x) => x.id === id);
        if (!item || normalizeStatus(item.status) === novoStatus) return;
        await updateDoc(doc(db, 'medidas_visitas', id), { status: novoStatus, atualizado_em: serverTimestamp() });
        showToast('Visita movida de etapa!', 'success');
      });
    });

    window.abrirCard = (id, ev, forcar = false) => {
      if (!forcar && ev?.target?.closest?.('button')) return;
      window.location.href = `${ROTAS.detalhesVisita || './detalhes-visita.html'}?id=${id}`;
    };

    window.abrirMapsCard = (ev, endereco) => {
      ev.stopPropagation();
      window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(endereco)}`, '_blank');
    };

    window.moverCard = async (ev, id, dir) => {
      ev.stopPropagation();
      const v = visitas.find((x) => x.id === id);
      if (!v) return;
      const idx = STATUS.indexOf(normalizeStatus(v.status));
      const next = STATUS[idx + dir];
      if (!next) return;
      await updateDoc(doc(db, 'medidas_visitas', id), { status: next, atualizado_em: serverTimestamp() });
    };

    window.arquivarCard = async (ev, id, flag) => {
      ev.stopPropagation();
      await updateDoc(doc(db, 'medidas_visitas', id), { arquivado: flag, atualizado_em: serverTimestamp() });
      showToast(flag ? 'Visita arquivada.' : 'Visita restaurada ao quadro.', 'info');
    };

    window.deletarCard = async (ev, id) => {
      ev.stopPropagation();
      if (!confirm('Deseja excluir permanentemente esta visita e todas as mídias vinculadas?')) return;
      try {
        const subSnap = await getDocs(collection(db, 'medidas_visitas', id, 'imagens'));
        await Promise.all(subSnap.docs.map((subDoc) => deleteDoc(doc(db, 'medidas_visitas', id, 'imagens', subDoc.id))));
      } catch (e) {
        console.warn('Aviso ao limpar subcoleção de imagens:', e);
      }
      await deleteDoc(doc(db, 'medidas_visitas', id));
      showToast('Visita excluída permanentemente.', 'info');
    };

    window.toggleDrawerArquivados = () => document.getElementById('drawer-arquivados').classList.toggle('open');
    window.abrirModalNovo = () => document.getElementById('modal-novo').classList.add('open');
    window.fecharModalNovo = () => document.getElementById('modal-novo').classList.remove('open');

    document.getElementById('busca-visitas').addEventListener('input', render);
    document.getElementById('busca-arquivadas').addEventListener('input', render);

    document.getElementById('form-novo').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const btn = document.getElementById('btn-submit-novo');
      btn.disabled = true;
      btn.textContent = 'Criando...';
      try {
        const servico = document.getElementById('novo-servico').value.trim();
        const novo = {
          empresa: document.getElementById('novo-empresa').value.trim(),
          cliente: document.getElementById('novo-cliente').value.trim(),
          servico,
          tipo_servico: servico,
          endereco: document.getElementById('novo-endereco').value.trim(),
          observacoes: '',
          status: 'solicitacoes',
          arquivado: false,
          totalImagens: 0,
          criado_em: serverTimestamp(),
          origem: 'medidas_visitas'
        };
        const ref = await addDoc(collection(db, 'medidas_visitas'), novo);
        window.location.href = `${ROTAS.detalhesVisita || './detalhes-visita.html'}?id=${ref.id}`;
      } catch (e) {
        showToast('Erro ao criar card de visita.', 'error');
        btn.disabled = false;
        btn.textContent = 'Criar e Abrir Ficha';
      }
    });

    onSnapshot(collection(db, 'medidas_visitas'), (snap) => {
      visitas = snap.docs.map((d) => ({ id: d.id, ...d.data(), status: normalizeStatus(d.data().status) }));
      visitas.sort((a, b) => (b.criado_em?.seconds || 0) - (a.criado_em?.seconds || 0));
      render();
    });

    if (new URLSearchParams(window.location.search).get('novo') === '1') {
      window.abrirModalNovo();
    }
  </script>
</body>
</html>
